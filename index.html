<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mondial 2026 — MPP Pronostics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efe9;
    --text: #1a1a18; --text2: #6b6a65; --text3: #9a9994;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --green-bg: #eaf3de; --green-text: #3b6d11;
    --blue-bg: #e6f1fb; --blue-text: #185fa5;
    --amber-bg: #faeeda; --amber-text: #854f0b;
    --red-bg: #fcebeb; --red-text: #a32d2d;
    --success: #3b6d11; --danger: #a32d2d;
    --rad: 8px; --rad-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c; --bg2: #2a2a27; --bg3: #323230;
      --text: #f0ede6; --text2: #a09e98; --text3: #6b6a65;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --green-bg: #173404; --green-text: #c0dd97;
      --blue-bg: #042c53; --blue-text: #b5d4f4;
      --amber-bg: #412402; --amber-text: #fac775;
      --red-bg: #501313; --red-text: #f7c1c1;
      --success: #c0dd97; --danger: #f7c1c1;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:15px;line-height:1.5}
  .header{background:var(--bg);border-bottom:.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .header-title{font-size:20px;font-weight:600}
  .header-sub{font-size:13px;color:var(--text2)}
  .container{max-width:960px;margin:0 auto;padding:20px 16px}
  .top-nav{display:flex;gap:4px;margin-bottom:20px;border-bottom:.5px solid var(--border);flex-wrap:wrap;position:sticky;top:57px;background:var(--bg3);z-index:90;padding-top:8px}
  .nav-btn{padding:8px 16px;font-size:14px;background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;color:var(--text2);font-family:inherit;white-space:nowrap;margin-bottom:-1px;transition:color .15s}
  .nav-btn:hover{color:var(--text)}
  .nav-btn.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
  .page{display:none}.page.on{display:block}

  /* GROUP GRID */
  .grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}
  .grp-btn{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:12px;cursor:pointer;text-align:left;transition:all .15s;color:var(--text)}
  .grp-btn:hover{border-color:var(--border2);background:var(--bg2)}
  .grp-btn.active{border:2px solid var(--blue-text);background:var(--blue-bg)}
  .grp-letter{font-size:18px;font-weight:600;margin-bottom:5px}
  .grp-teams{font-size:11px;color:var(--text2);line-height:1.7}

  /* SECTION TABS */
  .sec-nav{display:flex;gap:6px;margin-bottom:16px}
  .sec-btn{padding:6px 14px;font-size:13px;background:var(--bg2);border:.5px solid var(--border);border-radius:var(--rad);cursor:pointer;color:var(--text2);font-family:inherit;transition:all .15s}
  .sec-btn:hover{color:var(--text);background:var(--bg3)}
  .sec-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* TEAM CARDS */
  .team-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
  .tc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:12px;cursor:pointer;transition:all .15s}
  .tc:hover{border-color:var(--border2)}
  .tc.sel{border:2px solid var(--blue-text);background:var(--blue-bg)}
  .tc-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .tc-flag{font-size:22px}
  .tc-name{font-size:13px;font-weight:600}
  .tc-rank{font-size:11px;color:var(--text2)}
  .tc-tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:10px;padding:2px 7px;border-radius:var(--rad);font-weight:500}
  .tg{background:var(--green-bg);color:var(--green-text)}
  .tb{background:var(--blue-bg);color:var(--blue-text)}
  .tw{background:var(--amber-bg);color:var(--amber-text)}
  .ts{background:var(--bg3);color:var(--text2)}

  /* TEAM DETAIL */
  .tdetail{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:20px;margin-bottom:14px}
  .tdetail h3{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tcoach{font-size:12px;color:var(--text2);font-weight:400;margin-left:4px}
  .meter-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .meter-label{font-size:12px;color:var(--text2);width:80px;flex-shrink:0}
  .meter-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .mf{height:100%;border-radius:3px}
  .mg{background:#639922}.mb{background:#185fa5}.mw{background:#ba7517}.mr{background:#a32d2d}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .db{background:var(--bg2);border-radius:var(--rad);padding:12px}
  .db h4{font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .db p{font-size:13px;line-height:1.55}
  .full{grid-column:1/-1}

  /* MATCH CARDS */
  .mc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:16px 18px;margin-bottom:12px}
  .mmeta{font-size:11px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .mteams{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .mt{flex:1}.mt.r{text-align:right}
  .mtn{font-size:15px;font-weight:600}
  .mtr{font-size:11px;color:var(--text2)}
  .mvs{font-size:13px;color:var(--text3);flex-shrink:0;padding:0 4px}
  .odds-row{display:flex;gap:6px;margin-bottom:12px}
  .op{flex:1;text-align:center;background:var(--bg2);border-radius:var(--rad);padding:7px 4px}
  .ol{font-size:10px;color:var(--text2);margin-bottom:2px}
  .ov{font-size:14px;font-weight:600}
  .analysis{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:10px;border-left:3px solid var(--border2);padding-left:10px}
  .conseil{font-size:13px;background:var(--green-bg);color:var(--green-text);padding:9px 12px;border-radius:var(--rad);margin-bottom:12px;line-height:1.5}

  /* PRONO */
  .prono-section h4{font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .pi{display:flex;align-items:center;gap:8px}
  .pi input[type=number]{width:48px;text-align:center;font-size:17px;font-weight:600;padding:6px 4px;border:1.5px solid var(--border2);border-radius:var(--rad);background:var(--bg);color:var(--text);font-family:inherit}
  .pi input[type=number]:focus{outline:none;border-color:var(--blue-text)}
  .psep{font-size:16px;color:var(--text2)}
  .pteam{font-size:12px;color:var(--text2);flex:1}
  .pteam.r{text-align:right}
  .save-btn{margin-top:10px;width:100%;padding:8px;font-size:13px;background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--rad);cursor:pointer;color:var(--text);font-family:inherit;transition:all .15s}
  .save-btn:hover{background:var(--bg3)}
  .save-btn:active{transform:scale(.98)}
  .saved-ok{font-size:12px;color:var(--success);margin-top:6px;display:none}

  /* STANDINGS */
  .stt{width:100%;border-collapse:collapse;font-size:13px}
  .stt th{font-size:11px;color:var(--text2);font-weight:500;padding:6px 8px;text-align:center;border-bottom:.5px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
  .stt th:first-child{text-align:left}
  .stt td{padding:9px 8px;text-align:center;border-bottom:.5px solid var(--border)}
  .stt td:first-child{text-align:left;font-weight:600}
  .stt tr:last-child td{border-bottom:none}
  .qi{display:inline-block;width:4px;height:18px;border-radius:2px;margin-right:8px;vertical-align:middle}
  .qg{background:#639922}.qy{background:#ba7517}.qr{background:var(--border2)}
  .pos-up{color:var(--success)}.pos-dn{color:var(--danger)}

  /* MPP DASHBOARD */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .stat-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:14px;text-align:center}
  .stat-num{font-size:26px;font-weight:700}
  .stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}
  .fav-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .fav-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:14px}
  .fav-card label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
  .fav-card select{width:100%;padding:7px 10px;font-size:13px;border:.5px solid var(--border2);border-radius:var(--rad);background:var(--bg);color:var(--text);font-family:inherit;cursor:pointer}
  .fav-recap{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:16px;font-size:14px;line-height:2.2}
  .section-title{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}

  /* PROGRESS BAR */
  .progress-wrap{background:var(--bg3);border-radius:3px;height:6px;margin-top:6px;overflow:hidden}
  .progress-fill{height:100%;background:var(--blue-text);border-radius:3px;transition:width .3s}

  /* MATCH DU SOIR */
  .mdj-header{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:18px;margin-bottom:14px}
  .mdj-matchup{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .mdj-team{text-align:center;flex:1}
  .mdj-flag{font-size:40px;display:block;margin-bottom:4px}
  .mdj-name{font-size:16px;font-weight:700}
  .mdj-rank{font-size:12px;color:var(--text2)}
  .mdj-vs{font-size:24px;font-weight:700;color:var(--text3);flex-shrink:0}
  .mdj-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .mdj-pill{font-size:12px;background:var(--bg2);border-radius:var(--rad);padding:4px 10px;color:var(--text2)}
  .mdj-odds{display:flex;gap:6px}
  .mdj-odd{flex:1;text-align:center;background:var(--bg2);border-radius:var(--rad);padding:7px 4px}
  .mdj-odd-l{font-size:10px;color:var(--text2);margin-bottom:2px}
  .mdj-odd-v{font-size:15px;font-weight:700}
  .mdj-section{font-size:14px;font-weight:600;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
  .mdj-block{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:14px;margin-bottom:10px}
  .mdj-block h4{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .mdj-block p,.mdj-block li{font-size:13px;line-height:1.7;color:var(--text)}
  .mdj-block ul{padding-left:16px}
  .mdj-xi{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .mdj-player{font-size:12px;background:var(--bg2);border-radius:var(--rad);padding:3px 8px}
  .mdj-verdict{background:var(--green-bg);border:.5px solid var(--green-text);border-radius:var(--rad-lg);padding:16px;margin-bottom:10px}
  .mdj-verdict h3{font-size:15px;font-weight:700;color:var(--green-text);margin-bottom:8px}
  .mdj-verdict p{font-size:13px;line-height:1.7;color:var(--green-text)}
  .mdj-prono-box{background:var(--bg);border:2px solid var(--green-text);border-radius:var(--rad-lg);padding:16px;text-align:center;margin-bottom:10px}
  .mdj-score{font-size:32px;font-weight:800;color:var(--green-text);margin:4px 0}
  .mdj-updated{font-size:11px;color:var(--text3);text-align:right;margin-bottom:8px}

  .res-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .res-stat{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:14px;text-align:center}
  .res-stat-num{font-size:26px;font-weight:700}
  .res-stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}
  .res-stat-sub{font-size:11px;margin-top:2px}
  .res-match{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .res-teams{flex:1;min-width:160px}
  .res-teams-name{font-size:13px;font-weight:600}
  .res-teams-date{font-size:11px;color:var(--text2)}
  .res-scores{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .res-score-box{text-align:center;min-width:52px}
  .res-score-lbl{font-size:10px;color:var(--text2);margin-bottom:2px}
  .res-score-val{font-size:15px;font-weight:700}
  .res-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--rad);flex-shrink:0}
  .badge-exact{background:var(--green-bg);color:var(--green-text)}
  .badge-issue{background:var(--blue-bg);color:var(--blue-text)}
  .badge-miss{background:var(--red-bg);color:var(--red-text)}
  .badge-pending{background:var(--bg3);color:var(--text3)}
  .res-claude{font-size:11px;color:var(--text2);flex-shrink:0;min-width:60px;text-align:center}
  .res-section-title{font-size:15px;font-weight:600;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
  .insight-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:14px;margin-bottom:10px}
  .insight-card h4{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .insight-card p{font-size:13px;color:var(--text2);line-height:1.6}
  .score-input-row{display:flex;align-items:center;gap:6px;margin-top:8px}
  .score-input-row input{width:40px;text-align:center;font-size:14px;font-weight:600;padding:5px 3px;border:1.5px solid var(--border2);border-radius:var(--rad);background:var(--bg);color:var(--text);font-family:inherit}
  .score-input-row .save-btn{padding:5px 12px;font-size:12px;width:auto}
  @media(max-width:600px){.res-stat-grid{grid-template-columns:repeat(2,1fr)}.res-scores{gap:5px}}

    .grp-grid{grid-template-columns:repeat(3,1fr)}
    .team-row{grid-template-columns:1fr 1fr}
    .detail-grid{grid-template-columns:1fr}
    .fav-grid{grid-template-columns:1fr}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .mteams{gap:6px}
    .mtn{font-size:13px}
    .full{grid-column:auto}
  }
</style>
</head>
<body>

<div class="header">
  <span style="font-size:26px">⚽</span>
  <div style="flex:1">
    <div class="header-title">Mondial 2026</div>
    <div class="header-sub">MPP · Pronostics · 12 groupes · 48 équipes</div>
  </div>
  <button onclick="saveAll()" id="save-all-btn" style="padding:8px 16px;font-size:13px;font-weight:600;background:#639922;color:#fff;border:none;border-radius:var(--rad);cursor:pointer;font-family:inherit;flex-shrink:0;transition:opacity .15s">💾 Enregistrer tout</button>
  <span id="save-all-ok" style="font-size:12px;color:var(--success);margin-left:8px;display:none">✅ Sauvegardé !</span>
</div>

<div class="container">
  <nav class="top-nav">
    <button class="nav-btn active" onclick="nav('groupes',this)">Groupes & fiches</button>
    <button class="nav-btn" onclick="nav('match',this)">🔥 Match du soir</button>
    <button class="nav-btn" onclick="nav('calendrier',this)">📅 Calendrier</button>
    <button class="nav-btn" onclick="nav('resultats',this)">📊 Résultats</button>
    <button class="nav-btn" onclick="nav('mpp',this)">Favoris MPP</button>
  </nav>

  <div id="page-groupes" class="page on">
    <div class="grp-grid" id="grp-grid"></div>
    <div id="grp-content"></div>
  </div>

  <div id="page-match" class="page">
    <div id="match-content"></div>
  </div>

  <div id="page-calendrier" class="page">
    <div id="cal-content"></div>
  </div>

  <div id="page-resultats" class="page">
    <div id="res-content"></div>
  </div>

  <div id="page-mpp" class="page">

    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-num" id="st-p">0</div><div class="stat-lbl">Pronos saisis</div><div class="progress-wrap"><div class="progress-fill" id="st-bar" style="width:0%"></div></div></div>
      <div class="stat-card"><div class="stat-num">72</div><div class="stat-lbl">Total matchs</div></div>
      <div class="stat-card"><div class="stat-num" id="st-b">0</div><div class="stat-lbl">Buts prévus</div></div>
      <div class="stat-card"><div class="stat-num" id="st-avg">—</div><div class="stat-lbl">Buts / match</div></div>
    </div>
    <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="exportPronos()" style="padding:8px 16px;font-size:13px;background:var(--bg);border:.5px solid var(--border2);border-radius:var(--rad);cursor:pointer;font-family:inherit;color:var(--text)">📋 Copier mes pronos (JSON)</button>
      <button onclick="clearPronos()" style="padding:8px 16px;font-size:13px;background:var(--red-bg);border:.5px solid var(--border2);border-radius:var(--rad);cursor:pointer;font-family:inherit;color:var(--red-text)">🗑️ Réinitialiser</button>
      <span id="export-ok" style="font-size:12px;color:var(--success);padding:8px;display:none">✅ Copié dans le presse-papiers !</span>
    </div>
    <div class="section-title">🏆 Mes pronostics globaux</div>
    <div class="fav-grid">
      <div class="fav-card"><label>Vainqueur du Mondial</label><select id="sel-w" onchange="saveFav()"><option value="">— Choisir —</option><option>France 🇫🇷</option><option>Espagne 🇪🇸</option><option>Angleterre 🏴󠁧󠁢󠁥󠁮󠁧󠁿</option><option>Brésil 🇧🇷</option><option>Argentine 🇦🇷</option><option>Portugal 🇵🇹</option><option>Allemagne 🇩🇪</option><option>Pays-Bas 🇳🇱</option><option>Mexique 🇲🇽</option><option>Corée du Sud 🇰🇷</option><option>Colombie 🇨🇴</option><option>USA 🇺🇸</option></select></div>

const GL = ['A','B','C','D','E','F','G','H','I','J','K','L'];
let curG = 'A';

function nav(p, btn) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('on');
  btn.classList.add('active');
  if (p === 'mpp') { updateStats(); loadFavs(); updateFavRecap(); }
  if (p === 'calendrier') buildCalendrier();
  if (p === 'resultats') buildResultats();
  if (p === 'match') buildMatch();
}

function buildCalendrier() {
  // Collect all matches from all groups with their group key
  const allMatches = [];
  GL.forEach(g => {
    GD[g].matches.forEach(m => {
      allMatches.push({...m, grp: g});
    });
  });

  // Parse date from d string like "11 juin · Azteca, Mexico City"
  const monthMap = {janvier:1,février:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,septembre:9,octobre:10,novembre:11,décembre:12};
  function parseDate(d) {
    const m = d.match(/(\d+)\s+(\w+)/);
    if (!m) return 0;
    return parseInt(m[1]) + (monthMap[m[2]] || 0) * 100;
  }

  allMatches.sort((a, b) => {
    const da = parseDate(a.d), db = parseDate(b.d);
    if (da !== db) return da - db;
    return a.id.localeCompare(b.id);
  });

  // Group by date
  const byDate = {};
  allMatches.forEach(m => {
    const dateKey = m.d.split('·')[0].trim();
    if (!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push(m);
  });

  const riskColors = {
    high: 'var(--amber-bg)',
    mid: 'var(--blue-bg)',
    low: 'var(--green-bg)'
  };
  const riskTextColors = {
    high: 'var(--amber-text)',
    mid: 'var(--blue-text)',
    low: 'var(--green-text)'
  };

  let html = '';
  Object.entries(byDate).forEach(([date, matches]) => {
    const done = matches.filter(m => pronos[m.id]).length;
    html += `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:15px;font-weight:600">📅 ${date}</div>
        <div style="font-size:11px;color:var(--text2)">${done}/${matches.length} pronos</div>
      </div>`;

    matches.forEach(m => {
      const h = getT(m.grp, m.h), a = getT(m.grp, m.a);
      const p = pronos[m.id];
      const venue = m.d.includes('·') ? m.d.split('·').slice(1).join('·').trim() : '';
      const hasPrno = p !== undefined;
      const riskC = m.strat ? riskColors[m.strat.risk] : 'var(--bg2)';
      const riskTxt = m.strat ? riskTextColors[m.strat.risk] : 'var(--text2)';
      const fireIcon = m.strat && m.strat.risk === 'high' ? '🔥 ' : '';

      html += `<div onclick="goToMatch('${m.grp}','${m.id}')" style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--rad-lg);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:12px" onmouseover="this.style.borderColor='var(--border2)'" onmouseout="this.style.borderColor='var(--border)'">
        <!-- Groupe badge -->
        <div style="background:var(--bg3);border-radius:var(--rad);padding:4px 8px;font-size:11px;font-weight:600;color:var(--text2);flex-shrink:0;text-align:center;min-width:28px">
          ${m.grp}<br><span style="font-size:9px;font-weight:400">J${m.j}</span>
        </div>
        <!-- Teams & venue -->
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;flex-wrap:wrap">
            <span>${h.fl} ${h.n}</span>
            <span style="color:var(--text3);font-size:12px">vs</span>
            <span>${a.n} ${a.fl}</span>
          </div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${venue}</div>
        </div>
        <!-- Score conseillé -->
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:10px;color:var(--text2);margin-bottom:2px">Conseil</div>
          <div style="font-size:13px;font-weight:600;color:var(--text2)">${m.p}</div>
        </div>
        <!-- Mon prono -->
        <div style="text-align:center;flex-shrink:0;min-width:52px">
          <div style="font-size:10px;color:var(--text2);margin-bottom:2px">Mon prono</div>
          ${hasPrno
            ? `<div style="font-size:13px;font-weight:700;color:var(--success)">${p.h}-${p.a}</div>`
            : `<div style="font-size:11px;color:var(--text3);font-style:italic">—</div>`
          }
        </div>
        <!-- Opportunité badge -->
        ${m.strat && m.strat.risk !== 'low' ? `<div style="background:${riskC};color:${riskTxt};font-size:10px;font-weight:600;padding:3px 7px;border-radius:var(--rad);flex-shrink:0">${fireIcon}Valeur MPP</div>` : ''}
        <!-- Arrow -->
        <div style="color:var(--text3);font-size:14px;flex-shrink:0">›</div>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('cal-content').innerHTML = html;
}

function goToMatch(grp, mid) {
  // Navigate to the group, then to matches tab, then scroll to match
  curG = grp;
  // Switch to groupes page
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('page-groupes').classList.add('on');
  document.querySelector('.nav-btn').classList.add('active');
  // Build group content
  buildGrid();
  renderGroup();
  // Click matches tab
  setTimeout(() => {
    const matchBtn = document.querySelector(`#grp-content .sec-btn:nth-child(2)`);
    if (matchBtn) matchBtn.click();
    // Scroll to match
    setTimeout(() => {
      const el = document.getElementById('ph-' + mid);
      if (el) el.closest('.mc').scrollIntoView({behavior:'smooth', block:'center'});
    }, 100);
  }, 50);
}

function buildGrid() {
  document.getElementById('grp-grid').innerHTML = GL.map(g =>
    `<button class="grp-btn${g===curG?' active':''}" onclick="selGroup('${g}',this)">
      <div class="grp-letter">Groupe ${g}</div>
      <div class="grp-teams">${GD[g].teams.map(t=>t.fl+' '+t.n).join('<br>')}</div>
    </button>`
  ).join('');
}

function selGroup(g, el) {
  curG = g;
  document.querySelectorAll('.grp-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGroup();
}

function renderGroup() {
  const gd = GD[curG];
  document.getElementById('grp-content').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <span style="font-size:18px;font-weight:700">Groupe ${curG}</span>
      <div class="sec-nav">
        <button class="sec-btn active" onclick="secTab('teams','${curG}',this)">Équipes</button>
        <button class="sec-btn" onclick="secTab('matches','${curG}',this)">Matchs & pronos</button>
        <button class="sec-btn" onclick="secTab('standing','${curG}',this)">Classement</button>
      </div>
    </div>
    <div id="sec-teams-${curG}">
      <div class="team-row">${gd.teams.map(t=>teamCard(t,curG)).join('')}</div>
      <div id="tdet-${curG}"></div>
    </div>
    <div id="sec-matches-${curG}" style="display:none">${gd.matches.map(m=>matchCard(m,curG)).join('')}</div>
    <div id="sec-standing-${curG}" style="display:none">${standingHTML(curG)}</div>
  `;
  restoreProno(curG);
}

function secTab(tab, g, btn) {
  ['teams','matches','standing'].forEach(t => {
    const el = document.getElementById(`sec-${t}-${g}`);
    if (el) el.style.display = t===tab ? 'block' : 'none';
  });
  btn.closest('.sec-nav').querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'standing') refreshStanding(g);
}

function teamCard(t, g) {
  return `<div class="tc" id="tc-${g}-${t.c}" onclick="showTeam('${g}','${t.c}')">
    <div class="tc-head"><span class="tc-flag">${t.fl}</span><div><div class="tc-name">${t.n}</div><div class="tc-rank">FIFA ${t.rk}</div></div></div>
    <div class="tc-tags"><span class="tag ${t.atkT}">Attaque</span><span class="tag ${t.defT}">Défense</span><span class="tag ts">${t.style}</span></div>
  </div>`;
}

function bar(v, c) { return `<div class="meter-bar"><div class="mf ${c}" style="width:${v}%"></div></div>`; }

function showTeam(g, tc) {
  document.querySelectorAll(`#sec-teams-${g} .tc`).forEach(x => x.classList.remove('sel'));
  const card = document.getElementById(`tc-${g}-${tc}`);
  if (card) card.classList.add('sel');
  const t = GD[g].teams.find(x => x.c===tc);
  document.getElementById(`tdet-${g}`).innerHTML = `
    <div class="tdetail">
      <h3><span style="font-size:26px">${t.fl}</span>${t.n}<span class="tcoach">FIFA ${t.rk} · ${t.coach}</span></h3>
      <div class="meter-row"><span class="meter-label">Attaque</span>${bar(t.atk,'mg')}<span style="font-size:11px;color:var(--text2);width:40px">${t.atk}/100</span></div>
      <div class="meter-row"><span class="meter-label">Défense</span>${bar(t.def,'mb')}<span style="font-size:11px;color:var(--text2);width:40px">${t.def}/100</span></div>
      <div class="meter-row"><span class="meter-label">Tempo</span>${bar(t.tmp,'mw')}<span style="font-size:11px;color:var(--text2);width:40px">${t.tmp}/100</span></div>
      <div class="meter-row"><span class="meter-label">Agressivité</span>${bar(t.agg,'mr')}<span style="font-size:11px;color:var(--text2);width:40px">${t.agg}/100</span></div>
      <div class="detail-grid">
        <div class="db"><h4>⚔️ Attaque</h4><p>${t.atkD}</p></div>
        <div class="db"><h4>🛡️ Défense</h4><p>${t.defD}</p></div>
        <div class="db full"><h4>⚡ Style de jeu</h4><p>${t.styleD}</p></div>
        <div class="db"><h4>✅ Points forts</h4><p>${t.str}</p></div>
        <div class="db"><h4>⚠️ Points faibles</h4><p>${t.weak}</p></div>
        <div class="db full"><h4>⭐ Joueurs clés</h4><p>${t.key}</p></div>
      </div>
    </div>`;
}

function getT(g, c) { return GD[g].teams.find(t => t.c===c); }

function matchCard(m, g) {
  const h = getT(g, m.h), a = getT(g, m.a);
  // App scoring bar: [home_pts, draw_pts, away_pts, home_pct, draw_pct, away_pct]
  const sc = m.sc || null;
  let scoringHTML = '';
  let stratHTML = '';
  if (sc) {
    const [hp, dp, ap, hpct, dpct, apct] = sc;
    const bestPts = Math.max(hp, dp, ap);
    const hcls = hp === bestPts ? 'style="font-weight:700;color:var(--amber-text)"' : '';
    const dcls = dp === bestPts ? 'style="font-weight:700;color:var(--amber-text)"' : '';
    const acls = ap === bestPts ? 'style="font-weight:700;color:var(--amber-text)"' : '';
    scoringHTML = `
    <div style="margin-bottom:10px">
      <div style="font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px">📱 Barème app (pts · % joueurs)</div>
      <div style="display:flex;gap:6px">
        <div class="op" style="background:var(--bg2)"><div class="ol">${h.n}</div><div class="ov" ${hcls}>${hp} pts</div><div style="font-size:10px;color:var(--text3)">${hpct}% joueurs</div></div>
        <div class="op" style="background:var(--bg2)"><div class="ol">Nul</div><div class="ov" ${dcls}>${dp} pts</div><div style="font-size:10px;color:var(--text3)">${dpct}% joueurs</div></div>
        <div class="op" style="background:var(--bg2)"><div class="ol">${a.n}</div><div class="ov" ${acls}>${ap} pts</div><div style="font-size:10px;color:var(--text3)">${apct}% joueurs</div></div>
      </div>
    </div>`;
    // Strategic advice block
    if (m.strat) {
      const stratColor = m.strat.risk === 'high' ? 'var(--amber-bg)' : 'var(--blue-bg)';
      const stratTextColor = m.strat.risk === 'high' ? 'var(--amber-text)' : 'var(--blue-text)';
      stratHTML = `<div style="font-size:12px;background:${stratColor};color:${stratTextColor};padding:8px 12px;border-radius:var(--rad);margin-bottom:10px;line-height:1.6">
        🎯 <strong>Stratégie MPP :</strong> ${m.strat.txt}<br>
        <strong>Score optimal :</strong> ${m.strat.score} <span style="opacity:.7">(${m.strat.pts} pts si exact · issue prioritaire)</span>
      </div>`;
    }
  }
  return `<div class="mc">
    <div class="mmeta">🗓️ Journée ${m.j} · ${m.d}</div>
    <div class="mteams">
      <div class="mt"><div class="mtn">${h.fl} ${h.n}</div><div class="mtr">FIFA ${h.rk}</div></div>
      <div class="mvs">vs</div>
      <div class="mt r"><div class="mtn">${a.n} ${a.fl}</div><div class="mtr">FIFA ${a.rk}</div></div>
    </div>
    <div class="odds-row">
      <div class="op"><div class="ol">${h.n}</div><div class="ov">${m.o[0]}</div></div>
      <div class="op"><div class="ol">Nul</div><div class="ov">${m.o[1]}</div></div>

function refreshStanding(g) {
  const codes = GD[g].teams.map(t => t.c);
  const s = {}; codes.forEach(c => s[c]={j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0});
  GD[g].matches.forEach(m => {
    const p = pronos[m.id]; if (!p) return;
    const h=p.h, a=p.a;
    s[m.h].j++; s[m.a].j++;
    s[m.h].bp+=h; s[m.h].bc+=a; s[m.a].bp+=a; s[m.a].bc+=h;
    if(h>a){s[m.h].v++;s[m.h].pts+=3;s[m.a].d++;}
    else if(h<a){s[m.a].v++;s[m.a].pts+=3;s[m.h].d++;}
    else{s[m.h].n++;s[m.a].n++;s[m.h].pts++;s[m.a].pts++;}
  });
  const sorted = codes.slice().sort((a,b)=>s[b].pts!==s[a].pts?s[b].pts-s[a].pts:(s[b].bp-s[b].bc)-(s[a].bp-s[a].bc));
  const body = document.getElementById('stb-'+g); if (!body) return;
  body.innerHTML = sorted.map((c,i)=>{
    const t=GD[g].teams.find(x=>x.c===c), st=s[c];
    const qi=i<2?'qg':i===2?'qy':'qr';
    const diff=st.bp-st.bc;
    return `<tr><td><span class="qi ${qi}"></span>${t.fl} ${t.n}</td><td>${st.j}</td><td>${st.v}</td><td>${st.n}</td><td>${st.d}</td><td>${st.bp}</td><td>${st.bc}</td><td class="${diff>0?'pos-up':diff<0?'pos-dn':''}">${diff>0?'+':''}${diff}</td><td style="font-weight:700">${st.pts}</td></tr>`;
  }).join('');
}

function findMatchId(homeName, awayName) {
  for (const g of GL) {
    for (const m of GD[g].matches) {
      const h = getT(g, m.h), a = getT(g, m.a);
      if ((h.n === homeName && a.n === awayName) || (h.n === awayName && a.n === homeName)) return m.id;
    }
  }
  return null;
}

function getIssue(h, a) {
  if (h > a) return 'H';
  if (h < a) return 'A';
  return 'D';
}

function buildResultats() {
  const el = document.getElementById('res-content');
  if (!el) return;

  // Collect all matches
  const allMatches = [];
  GL.forEach(g => GD[g].matches.forEach(m => allMatches.push({...m, grp: g})));

  const played = allMatches.filter(m => realScores[m.id]);
  const pending = allMatches.filter(m => !realScores[m.id]);

  // Stats
  let exactOk = 0, issueOk = 0, totalPlayed = played.length;
  let realGoals = 0, pronoGoals = 0;
  let claudeExact = 0, claudeIssue = 0;

  played.forEach(m => {
    const real = realScores[m.id];
    const prono = pronos[m.id];
    const suggested = parseSuggestedScore(m.p);

    realGoals += real.h + real.a;
    if (prono) {
      pronoGoals += prono.h + prono.a;
      if (prono.h === real.h && prono.a === real.a) exactOk++;
      else if (getIssue(prono.h, prono.a) === getIssue(real.h, real.a)) issueOk++;
    }
    if (suggested) {
      if (suggested.h === real.h && suggested.a === real.a) claudeExact++;
      else if (getIssue(suggested.h, suggested.a) === getIssue(real.h, real.a)) claudeIssue++;
    }
  });

  const issueTotal = exactOk + issueOk;
  const pctExact = totalPlayed > 0 ? Math.round(exactOk / totalPlayed * 100) : 0;
  const pctIssue = totalPlayed > 0 ? Math.round(issueTotal / totalPlayed * 100) : 0;
  const avgReal = totalPlayed > 0 ? (realGoals / totalPlayed).toFixed(1) : '—';
  const avgProno = totalPlayed > 0 ? (pronoGoals / totalPlayed).toFixed(1) : '—';

  // Build insights
  const insights = buildInsights(played, exactOk, issueOk, claudeExact, claudeIssue, totalPlayed, avgReal, avgProno);

  let html = '';

  // --- STATS BAR ---
  html += `<div class="res-stat-grid">
    <div class="res-stat">
      <div class="res-stat-num" style="color:var(--green-text)">${exactOk}</div>
      <div class="res-stat-lbl">Scores exacts</div>
      <div class="res-stat-sub" style="color:var(--green-text)">${pctExact}% des matchs joués</div>
    </div>
    <div class="res-stat">
      <div class="res-stat-num" style="color:var(--blue-text)">${issueTotal}</div>
      <div class="res-stat-lbl">Issues correctes</div>
      <div class="res-stat-sub" style="color:var(--blue-text)">${pctIssue}% des matchs joués</div>
    </div>
    <div class="res-stat">
      <div class="res-stat-num">${avgReal}</div>
      <div class="res-stat-lbl">Buts réels / match</div>
      <div class="res-stat-sub" style="color:var(--text3)">Prévu : ${avgProno}</div>
    </div>
    <div class="res-stat">
      <div class="res-stat-num">${totalPlayed}<span style="font-size:14px;color:var(--text2)">/${allMatches.length}</span></div>
      <div class="res-stat-lbl">Matchs joués</div>
      <div class="res-stat-sub" style="color:var(--text3)">${pending.length} à venir</div>
    </div>
  </div>`;

  // --- INSIGHTS ---
  if (insights.length > 0) {
    html += `<div class="res-section-title">🧠 Analyse & conclusions</div>`;
    insights.forEach(ins => {
      html += `<div class="insight-card">
        <h4>${ins.icon} ${ins.title}</h4>
        <p>${ins.text}</p>
      </div>`;
    });
  }

  // --- MATCHES PLAYED ---
  if (played.length > 0) {
    html += `<div class="res-section-title">✅ Matchs joués (${played.length})</div>`;
    played.forEach(m => html += resMatchRow(m, true));
  }

  // --- MATCHES PENDING ---
  html += `<div class="res-section-title">⏳ Matchs à venir — Saisie des scores réels</div>
  <p style="font-size:12px;color:var(--text2);margin-bottom:12px">Saisis le score réel après chaque match pour mettre à jour l'analyse.</p>`;
  pending.forEach(m => html += resMatchRow(m, false));

  el.innerHTML = html;
}

function parseSuggestedScore(p) {
  if (!p) return null;
  const parts = p.split('-');
  if (parts.length !== 2) return null;
  return { h: parseInt(parts[0]), a: parseInt(parts[1]) };
}

function resMatchRow(m, played) {
  const h = getT(m.grp, m.h), a = getT(m.grp, m.a);
  const prono = pronos[m.id];
  const real = realScores[m.id];
  const suggested = parseSuggestedScore(m.p);
  const date = m.d.split('·')[0].trim();

  let badge = '';
  let pronoColor = 'var(--text2)';
  if (played && real && prono) {
    if (prono.h === real.h && prono.a === real.a) {
      badge = '<span class="res-badge badge-exact">🎯 Score exact</span>';
      pronoColor = 'var(--green-text)';
    } else if (getIssue(prono.h, prono.a) === getIssue(real.h, real.a)) {
      badge = '<span class="res-badge badge-issue">✅ Issue correcte</span>';
      pronoColor = 'var(--blue-text)';
    } else {
      badge = '<span class="res-badge badge-miss">❌ Raté</span>';
      pronoColor = 'var(--red-text)';
    }
  }

  let claudeBadge = '';
  if (played && real && suggested) {
    if (suggested.h === real.h && suggested.a === real.a) {
      claudeBadge = '<span style="font-size:10px;color:var(--green-text)">🎯 exact</span>';
    } else if (getIssue(suggested.h, suggested.a) === getIssue(real.h, real.a)) {
      claudeBadge = '<span style="font-size:10px;color:var(--blue-text)">✅ issue</span>';
    } else {
      claudeBadge = '<span style="font-size:10px;color:var(--red-text)">❌</span>';
    }
  }

  return `<div class="res-match">
    <div style="background:var(--bg3);border-radius:var(--rad);padding:3px 7px;font-size:11px;font-weight:600;color:var(--text2);flex-shrink:0">${m.grp}</div>
    <div class="res-teams" style="flex:1;min-width:120px">
      <div class="res-teams-name">${h.fl} ${h.n} vs ${a.n} ${a.fl}</div>
      <div class="res-teams-date">${date}</div>
    </div>
    <div class="res-scores">
      ${played && real ? `
      <div class="res-score-box">
        <div class="res-score-lbl">Réel</div>
        <div class="res-score-val">${real.h}–${real.a}</div>
      </div>` : ''}
      ${prono ? `
      <div class="res-score-box">
        <div class="res-score-lbl">Ton prono</div>
        <div class="res-score-val" style="color:${pronoColor}">${prono.h}–${prono.a}</div>
      </div>` : ''}
      ${suggested ? `
      <div class="res-score-box">
        <div class="res-score-lbl">Claude</div>
        <div class="res-score-val" style="color:var(--text3)">${suggested.h}–${suggested.a}</div>
        ${claudeBadge}
      </div>` : ''}
    </div>
    ${badge}
    ${!played ? `
    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
      <input type="number" min="0" max="20" id="rh-${m.id}" placeholder="0" style="width:36px;text-align:center;font-size:13px;padding:4px;border:1.5px solid var(--border2);border-radius:var(--rad);background:var(--bg);color:var(--text);font-family:inherit">
      <span style="color:var(--text3)">–</span>
      <input type="number" min="0" max="20" id="ra-${m.id}" placeholder="0" style="width:36px;text-align:center;font-size:13px;padding:4px;border:1.5px solid var(--border2);border-radius:var(--rad);background:var(--bg);color:var(--text);font-family:inherit">
      <button onclick="saveReal('${m.id}')" style="padding:4px 10px;font-size:12px;background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--rad);cursor:pointer;font-family:inherit;color:var(--text)">✓</button>
    </div>` : `
    <button onclick="editReal('${m.id}')" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 6px">✏️</button>`}
  </div>`;
}

function editReal(mid) {
  delete realScores[mid];
  saveRealScores();
  buildResultats();
}

function buildInsights(played, exactOk, issueOk, claudeExact, claudeIssue, total, avgReal, avgProno) {
  if (total === 0) return [{
    icon: '👋',
    title: 'Pas encore de matchs joués',
    text: 'Saisis les scores réels dans la section ci-dessous après chaque match pour voir l\'analyse apparaître ici.'
  }];

  const insights = [];
  const pctIssue = Math.round((exactOk + issueOk) / total * 100);
  const pctExact = Math.round(exactOk / total * 100);
  const claudeTotal = claudeExact + claudeIssue;
  const claudePct = Math.round(claudeTotal / total * 100);
  const realGoalsPerMatch = parseFloat(avgReal);
  const pronoGoalsPerMatch = parseFloat(avgProno);

  // Performance générale
  if (pctIssue >= 60) {
    insights.push({ icon: '🔥', title: `Excellente forme — ${pctIssue}% d'issues correctes`, text: `Tu as correctement prédit l'issue de ${exactOk + issueOk} matchs sur ${total}. ${exactOk > 0 ? `Dont ${exactOk} score${exactOk > 1 ? 's' : ''} exact${exactOk > 1 ? 's' : ''} — excellent pour le MPP.` : 'Maintenant l\'objectif est de commencer à avoir des scores exacts.'}` });
  } else if (pctIssue >= 40) {
    insights.push({ icon: '📈', title: `Performance correcte — ${pctIssue}% d'issues correctes`, text: `${exactOk + issueOk} issues correctes sur ${total} matchs. C'est dans la moyenne — les matchs ouverts peuvent faire monter ce chiffre rapidement.` });
  } else {
    insights.push({ icon: '⚠️', title: `Phase difficile — ${pctIssue}% d'issues correctes`, text: `Seulement ${exactOk + issueOk} issues correctes sur ${total} matchs. Les surprises s'accumulent — c'est souvent le cas en début de tournoi. L'analyse des erreurs peut aider à recalibrer.` });
  }

  // Comparaison avec Claude
  if (total >= 3) {
    const diff = (exactOk + issueOk) - claudeTotal;
    if (diff > 0) {
      insights.push({ icon: '🏆', title: `Tu bats Claude ! (+${diff} issues)`, text: `Tes pronos ont donné ${exactOk + issueOk} issues correctes vs ${claudeTotal} pour les conseils Claude. Tu as eu de bonnes intuitions que l'analyse n'avait pas capturées — garde confiance dans ton jugement sur les prochains matchs.` });
    } else if (diff === 0) {
      insights.push({ icon: '🤝', title: 'À égalité avec Claude', text: `Même nombre d'issues correctes. Les deux approches se valent — le score exact fera la différence dans le MPP.` });
    } else {
      insights.push({ icon: '🤖', title: `Claude légèrement devant (+${Math.abs(diff)} issues)`, text: `Les conseils Claude ont donné ${claudeTotal} issues correctes vs ${exactOk + issueOk} pour tes pronos. Ça ne veut pas dire grand chose sur ${total} matchs — la variance est élevée. Continue à challenger les conseils, c'est ce qui crée de la valeur.` });
    }
  }

  // Buts prévus vs réels
  if (!isNaN(realGoalsPerMatch) && !isNaN(pronoGoalsPerMatch) && total >= 5) {
    const diff = (pronoGoalsPerMatch - realGoalsPerMatch).toFixed(1);
    if (Math.abs(diff) > 0.5) {
      if (pronoGoalsPerMatch > realGoalsPerMatch) {
        insights.push({ icon: '⬇️', title: `Tu prévois trop de buts (+${diff} buts/match)`, text: `Tu prévois en moyenne ${pronoGoalsPerMatch} buts/match mais il n'y en a que ${realGoalsPerMatch} en réalité. Le tournoi est plus défensif que prévu — calibre tes prochains scores vers le bas, surtout sur les matchs tendus.` });
      } else {
        insights.push({ icon: '⬆️', title: `Les matchs sont plus prolifiques que prévu (+${Math.abs(diff)} buts/match)`, text: `${realGoalsPerMatch} buts/match en réalité vs ${pronoGoalsPerMatch} prévus. Le tournoi est plus offensif — n'hésite pas à revoir tes scores vers le haut sur les prochains matchs, surtout les mismatchs.` });
      }
    } else {
      insights.push({ icon: '🎯', title: `Calibrage des buts excellent`, text: `Tu prévois ${pronoGoalsPerMatch} buts/match, la réalité est ${realGoalsPerMatch}. Ton calibrage est très précis — continue sur cette lancée.` });
    }
  }

  // Scores exacts
  if (total >= 5 && pctExact === 0) {
    insights.push({ icon: '🎯', title: 'Pas encore de score exact', text: `Sur ${total} matchs, aucun score exact. C'est normal en début de tournoi — les scores exacts arrivent souvent en clusters. Focus sur les mismatchs clairs (ex: grosses équipes vs petites) où les scores sont plus prévisibles.` });
  } else if (pctExact >= 15) {
    insights.push({ icon: '🎯', title: `${pctExact}% de scores exacts — très fort !`, text: `${exactOk} score${exactOk > 1 ? 's' : ''} exact${exactOk > 1 ? 's' : ''} sur ${total} matchs. C'est bien au-dessus de la moyenne — c'est là que tu prends un avantage décisif dans le MPP.` });
  }

  return insights;
}

function exportPronos() {
  const txt = JSON.stringify(pronos, null, 2);
  navigator.clipboard.writeText(txt).then(() => {
    const ok = document.getElementById('export-ok');
    ok.style.display = 'inline';
    setTimeout(() => ok.style.display = 'none', 2500);
  }).catch(() => {
    prompt('Copie ce JSON :', txt);
  });
}

function clearPronos() {
  if (!confirm('Remettre tous les pronos à mes conseils par défaut ?')) return;
  pronos = {...DEFAULT_PRONOS};
  saveToStorage();
  updateStats();
  renderGroup();
}

function updateStats() {
  const total = Object.keys(pronos).length;
  const buts = Object.values(pronos).reduce((s,p)=>s+p.h+p.a,0);
  document.getElementById('st-p').textContent = total;
  document.getElementById('st-b').textContent = buts;
  document.getElementById('st-avg').textContent = total>0?(buts/total).toFixed(1):'—';
  document.getElementById('st-bar').style.width = Math.round(total/72*100)+'%';
  // Refresh calendar if visible
  if (document.getElementById('page-calendrier').classList.contains('on')) buildCalendrier();
}

function saveFav() {
  favs.w=document.getElementById('sel-w').value;
  favs.r=document.getElementById('sel-r').value;
  favs.g=document.getElementById('sel-g').value;
  favs.s=document.getElementById('sel-s').value;
  try { localStorage.setItem('mpp2026_favs', JSON.stringify(favs)); } catch(e) {}
  updateFavRecap();
}
function loadFavs() {
  if(favs.w) document.getElementById('sel-w').value=favs.w;
  if(favs.r) document.getElementById('sel-r').value=favs.r;
  if(favs.g) document.getElementById('sel-g').value=favs.g;
  if(favs.s) document.getElementById('sel-s').value=favs.s;
}
function updateFavRecap() {
  const el = document.getElementById('fav-recap');
  const lines=[];
  if(favs.w) lines.push(`🏆 <strong>Vainqueur :</strong> ${favs.w}`);
  if(favs.r) lines.push(`🥈 <strong>Finaliste :</strong> ${favs.r}`);
  if(favs.g) lines.push(`⚽ <strong>Golden Boot :</strong> ${favs.g}`);
  if(favs.s) lines.push(`✨ <strong>Outsider :</strong> ${favs.s}`);
  el.innerHTML = lines.length ? lines.join('<br>') : 'Aucune sélection pour l\'instant.';
}

loadFromStorage();
loadRealScores();
buildGrid();
renderGroup();
</script>
</body>
</html>
